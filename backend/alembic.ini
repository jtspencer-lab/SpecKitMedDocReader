"""Alembic configuration file."""

# Alembic Configuration
# This file is the configuration used by Alembic to work with your SQLAlchemy setup.

import os
from alembic.config import Config


def get_alembic_config():
    """Get Alembic configuration."""
    ini_file = os.path.join(os.path.dirname(__file__), "alembic.ini")
    config = Config(ini_file)
    
    # Configure database URL from environment
    config.set_main_option(
        "sqlalchemy.url",
        os.getenv(
            "DATABASE_URL",
            "postgresql://signupreader:password@localhost/signupreader_db"
        )
    )
    
    return config


if __name__ == "__main__":
    from alembic.cli import main
    main()
